name: Fix Dark NOC mypy compatibility

on:
  push:
    branches:
      - design/dark-noc-console-v1
    paths:
      - .github/workflows/fix-dark-noc-mypy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Check out design branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/dark-noc-console-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Apply precise type compatibility patch
        shell: pwsh
        run: |
          $path = "src/aruba_session_tracker/ui/noc_console.py"
          $text = (Get-Content -Raw -Encoding UTF8 $path).Replace("`r`n", "`n")

          $oldSize = "        calculated = super().sizeFromContents(content_type, option, size, widget)"
          $newSize = @'
                  calculated = (
                      super().sizeFromContents(content_type, option, size, widget)
                      if widget is not None
                      else super().sizeFromContents(content_type, option, size)
                  )
          '@.TrimEnd()
          if (-not $text.Contains($oldSize)) {
            throw "sizeFromContents target line was not found."
          }
          $text = $text.Replace($oldSize, $newSize)

          $oldGuard = "            if item is not None and item.widget() is not None:"
          $newGuard = @'
                      if item is None:
                          continue
                      item_widget = item.widget()
                      if item_widget is not None:
          '@.TrimEnd()
          if (-not $text.Contains($oldGuard)) {
            throw "layout-item guard line was not found."
          }
          $text = $text.Replace($oldGuard, $newGuard)

          $oldParent = "                item.widget().setParent(window.nav_identity)"
          $newParent = "                item_widget.setParent(window.nav_identity)"
          if (-not $text.Contains($oldParent)) {
            throw "layout-item parent line was not found."
          }
          $text = $text.Replace($oldParent, $newParent)

          [System.IO.File]::WriteAllText(
            (Resolve-Path $path),
            $text,
            [System.Text.UTF8Encoding]::new($false)
          )
          Remove-Item -Force .github/workflows/fix-dark-noc-mypy.yml

      - name: Commit compatibility fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Patch contains whitespace errors." }
          git commit -m "Fix Dark NOC Qt typing compatibility"
          if ($LASTEXITCODE -ne 0) { throw "Compatibility commit failed." }
          git push origin HEAD:design/dark-noc-console-v1
          if ($LASTEXITCODE -ne 0) { throw "Compatibility push failed." }
