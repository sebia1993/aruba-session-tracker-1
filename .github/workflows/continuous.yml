name: Continuous prerelease

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-prerelease
  cancel-in-progress: false

jobs:
  build:
    name: Validate current main and build Windows assets
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.provenance.outputs.commit }}
      version: ${{ steps.provenance.outputs.version }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out event commit with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Prove checkout is the event commit
        id: provenance
        shell: pwsh
        run: |
          $head = (git rev-parse --verify "HEAD^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $head -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Could not resolve checkout HEAD."
          }
          if (-not [string]::Equals($head, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase)) {
            throw "Checkout does not match the GitHub event commit."
          }
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Could not resolve project version."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "commit=$head" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$($version.Trim())" -Encoding utf8

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --no-input -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed." }
          python -m pip install --no-input --no-deps --no-build-isolation --check-build-dependencies -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable package installation failed." }

      - name: Validate source and build verified assets
        shell: pwsh
        env:
          BUILD_VERSION: ${{ steps.provenance.outputs.version }}
        run: |
          ./tools/validate.ps1 -PythonPath python
          ./build_windows.ps1 -PythonPath python -Version $env:BUILD_VERSION -SkipValidation -UseCurrentEnvironment

      - name: Retain verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArubaSessionTracker-continuous-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Replace moving continuous prerelease
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}

    steps:
      - name: Check out the verified build scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Set up verification Python 3.13 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Download verified inputs only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ArubaSessionTracker-continuous-${{ github.sha }}
          path: artifacts/release

      - name: Reverify current main and update continuous prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $mainJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve current main." }
          $main = $mainJson | ConvertFrom-Json
          if (
            $main.object.type -ne "commit" -or
            -not [string]::Equals(
              $main.object.sha, $env:EXPECTED_COMMIT, [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw "A newer main commit exists; this continuous build will not publish."
          }

          $releaseRoot = Join-Path $PWD "artifacts/release"
          ./tools/verify_publish_assets.ps1 `
            -ReleaseRoot $releaseRoot `
            -Version $env:RELEASE_VERSION `
            -ExpectedCommit $env:EXPECTED_COMMIT
          $zip = Join-Path $releaseRoot "ArubaSessionTracker_v${env:RELEASE_VERSION}_windows_x64.zip"
          $sha = "$zip.sha256"
          $sbom = Join-Path $releaseRoot "ArubaSessionTracker_v${env:RELEASE_VERSION}_sbom.cdx.json"
          $notes = Join-Path $releaseRoot "release-notes-v${env:RELEASE_VERSION}.md"

          $releaseListJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing releases." }
          $matchingReleases = @(
            $releaseListJson | ConvertFrom-Json | Where-Object { $_.tag_name -eq "continuous" }
          )
          if ($matchingReleases.Count -gt 1) {
            throw "More than one continuous release was returned."
          }

          if ($matchingReleases.Count -eq 0) {
            gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/continuous" *> $null
            if ($LASTEXITCODE -eq 0) {
              gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/continuous" `
                -f "sha=$env:EXPECTED_COMMIT" -F force=true *> $null
            } else {
              gh api -X POST "repos/$env:GITHUB_REPOSITORY/git/refs" `
                -f "ref=refs/tags/continuous" -f "sha=$env:EXPECTED_COMMIT" *> $null
            }
            if ($LASTEXITCODE -ne 0) { throw "Could not prepare the continuous tag." }
            gh release create continuous $zip $sha $sbom `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --prerelease `
              --title "Aruba Session Tracker continuous" `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not publish continuous prerelease." }
          } else {
            $release = $matchingReleases[0]
            $shortCommit = $env:EXPECTED_COMMIT.Substring(0, 12).ToLowerInvariant()
            $candidateRoot = Join-Path $releaseRoot "continuous-staging"
            New-Item -ItemType Directory -Force -Path $candidateRoot | Out-Null
            $assetMap = @(
              [pscustomobject]@{
                Canonical = [IO.Path]::GetFileName($zip)
                Source = $zip
                Candidate = "candidate-${shortCommit}--$([IO.Path]::GetFileName($zip))"
                CandidatePath = $null
                CandidateId = 0
              },
              [pscustomobject]@{
                Canonical = [IO.Path]::GetFileName($sha)
                Source = $sha
                Candidate = "candidate-${shortCommit}--$([IO.Path]::GetFileName($sha))"
                CandidatePath = $null
                CandidateId = 0
              },
              [pscustomobject]@{
                Canonical = [IO.Path]::GetFileName($sbom)
                Source = $sbom
                Candidate = "candidate-${shortCommit}--$([IO.Path]::GetFileName($sbom))"
                CandidatePath = $null
                CandidateId = 0
              }
            )
            foreach ($item in $assetMap) {
              $item.CandidatePath = Join-Path $candidateRoot $item.Candidate
              Copy-Item -LiteralPath $item.Source -Destination $item.CandidatePath -Force
            }

            # Candidate uploads never replace the public canonical assets.
            foreach ($stale in @($release.assets)) {
              if ($assetMap.Candidate -contains $stale.name) {
                gh api -X DELETE `
                  "repos/$env:GITHUB_REPOSITORY/releases/assets/$($stale.id)" *> $null
                if ($LASTEXITCODE -ne 0) { throw "Could not remove a stale candidate asset." }
              }
            }
            $candidatePaths = @($assetMap.CandidatePath)
            & gh release upload continuous @candidatePaths --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Could not upload continuous candidate assets." }

            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not verify continuous candidate assets." }
            foreach ($item in $assetMap) {
              $candidate = @($release.assets | Where-Object { $_.name -eq $item.Candidate })
              if (
                $candidate.Count -ne 1 -or
                [int64]$candidate[0].size -ne [int64](Get-Item -LiteralPath $item.Source).Length
              ) {
                throw "A continuous candidate asset failed its size/uniqueness check."
              }
              $item.CandidateId = [int64]$candidate[0].id
            }

            # Hide the release only for the pointer swap. Every prior asset is
            # renamed, not deleted, until the new public release is verified.
            gh release edit continuous --repo $env:GITHUB_REPOSITORY --draft
            if ($LASTEXITCODE -ne 0) { throw "Could not stage the continuous release update." }
            foreach ($item in $assetMap) {
              foreach ($old in @($release.assets | Where-Object { $_.name -eq $item.Canonical })) {
                $previousName = "previous-$($old.id)--$($item.Canonical)"
                gh api -X PATCH `
                  "repos/$env:GITHUB_REPOSITORY/releases/assets/$($old.id)" `
                  -f "name=$previousName" *> $null
                if ($LASTEXITCODE -ne 0) { throw "Could not preserve a prior continuous asset." }
              }
              gh api -X PATCH `
                "repos/$env:GITHUB_REPOSITORY/releases/assets/$($item.CandidateId)" `
                -f "name=$($item.Canonical)" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Could not promote a continuous candidate asset." }
            }

            gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/continuous" `
              -f "sha=$env:EXPECTED_COMMIT" -F force=true *> $null
            if ($LASTEXITCODE -ne 0) { throw "Could not advance the continuous tag." }
            gh release edit continuous `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:EXPECTED_COMMIT `
              --draft=false `
              --prerelease `
              --title "Aruba Session Tracker continuous" `
              --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not publish updated continuous metadata." }

            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" |
              ConvertFrom-Json
            if (
              $LASTEXITCODE -ne 0 -or $release.draft -ne $false -or
              $release.prerelease -ne $true
            ) {
              throw "Updated continuous release state could not be verified."
            }
            foreach ($item in $assetMap) {
              $published = @($release.assets | Where-Object { $_.name -eq $item.Canonical })
              if (
                $published.Count -ne 1 -or
                [int64]$published[0].size -ne [int64](Get-Item -LiteralPath $item.Source).Length
              ) {
                throw "A published continuous asset failed its size/uniqueness check."
              }
            }
            $keepNames = @($assetMap.Canonical)
            foreach ($asset in @($release.assets)) {
              if ($keepNames -notcontains $asset.name) {
                gh api -X DELETE `
                  "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" *> $null
                if ($LASTEXITCODE -ne 0) { throw "Could not remove a stale continuous asset." }
              }
            }
          }
