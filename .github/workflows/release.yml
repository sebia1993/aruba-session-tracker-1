name: Versioned prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify annotated tag and build Windows assets
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release_ref.outputs.commit }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out tagged commit with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Require annotated tag, event SHA, checkout, and current main equality
        id: release_ref
        shell: pwsh
        run: |
          python tools/check_release_ref.py --tag $env:RELEASE_TAG --event-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Release ref gate failed." }
          $commit = (git rev-parse --verify "HEAD^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Could not record verified commit."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "commit=$commit" -Encoding utf8

      - name: Require synchronized version
        shell: pwsh
        run: |
          python tools/check_version.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Release version gate failed." }

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --no-input -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed." }
          python -m pip install --no-input --no-deps --no-build-isolation --check-build-dependencies -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable package installation failed." }

      - name: Validate and build exact release inputs
        shell: pwsh
        run: |
          ./tools/validate.ps1 -PythonPath python
          $version = $env:RELEASE_TAG.Substring(1)
          ./build_windows.ps1 -PythonPath python -Version $version -SkipValidation -UseCurrentEnvironment

      - name: Retain verified release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ArubaSessionTracker-${{ github.ref_name }}-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  release-soak:
    name: Verify exact tag with 20,000-poll fixture-only soak
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      ARUBA_SOAK_POLLS: "20000"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out tagged commit with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Require exact annotated tag provenance
        shell: pwsh
        run: |
          python tools/check_release_ref.py --tag $env:RELEASE_TAG --event-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Release soak ref gate failed." }

      - name: Require synchronized version
        shell: pwsh
        run: |
          python tools/check_version.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Release soak version gate failed." }

      - name: Install pinned test dependencies
        shell: pwsh
        run: |
          python -m pip install --no-input -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned test dependency installation failed." }
          python -m pip install --no-input --no-deps --no-build-isolation `
            --check-build-dependencies -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable package installation failed." }

      - name: Run exact-tag synthetic soak tests only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python -m pytest -m soak -q --junitxml=artifacts/release-soak.xml
          if ($LASTEXITCODE -ne 0) { throw "Release synthetic soak tests failed." }

      - name: Retain non-sensitive release soak result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ArubaSessionTracker-${{ github.ref_name }}-release-soak
          path: artifacts/release-soak.xml
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish workflow-protected versioned prerelease
    needs:
      - build
      - release-soak
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out the verified build scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Set up verification Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install pinned publish verification dependencies
        shell: pwsh
        run: |
          python -m pip install --no-input -r requirements-runtime.lock
          if ($LASTEXITCODE -ne 0) { throw "Publish verification dependency installation failed." }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "Publish verification dependency check failed." }

      - name: Download verified inputs only
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ArubaSessionTracker-${{ github.ref_name }}-windows-x64
          path: artifacts/release

      - name: Reverify remote provenance and publish once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not [string]::Equals(
            $env:EXPECTED_COMMIT, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Verified build commit does not match the release event."
          }

          function Assert-VersionedTagProvenance {
            $tagRefJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve release tag." }
            $tagRef = $tagRefJson | ConvertFrom-Json
            if ($tagRef.object.type -ne "tag") { throw "Release tag is not annotated." }
            $tagObjectJson = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($tagRef.object.sha)"
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve annotated tag object." }
            $tagObject = $tagObjectJson | ConvertFrom-Json
            if (
              $tagObject.object.type -ne "commit" -or
              -not [string]::Equals(
                $tagObject.object.sha, $env:EXPECTED_COMMIT, [StringComparison]::OrdinalIgnoreCase
              )
            ) {
              throw "Annotated tag moved or does not directly reference the verified commit."
            }
          }
          function Assert-MainAtExpected {
            $mainJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main"
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve current main." }
            $main = $mainJson | ConvertFrom-Json
            if (
              $main.object.type -ne "commit" -or
              -not [string]::Equals(
                [string]$main.object.sha,
                $env:EXPECTED_COMMIT,
                [StringComparison]::OrdinalIgnoreCase
              )
            ) {
              throw "Remote main moved after the verified build."
            }
          }
          Assert-VersionedTagProvenance
          Assert-MainAtExpected
          $version = $env:RELEASE_TAG.Substring(1)
          $releaseRoot = Join-Path $PWD "artifacts/release"
          ./tools/verify_publish_assets.ps1 `
            -ReleaseRoot $releaseRoot `
            -Version $version `
            -ExpectedCommit $env:EXPECTED_COMMIT
          $zip = Join-Path $releaseRoot "ArubaSessionTracker_v${version}_windows_x64.zip"
          $sha = "$zip.sha256"
          $sbom = Join-Path $releaseRoot "ArubaSessionTracker_v${version}_sbom.cdx.json"
          $notes = Join-Path $releaseRoot "release-notes-v${version}.md"
          # The sidecar and external SBOM remain verified build inputs. Only the
          # Windows x64 ZIP is a public GitHub release asset; the SBOM is also
          # embedded inside that ZIP and the digest is written into the body.
          $assetPaths = @($zip)
          $assetNames = @($assetPaths | ForEach-Object { [IO.Path]::GetFileName($_) })
          $marker = "<!-- aruba-session-tracker-release:$env:RELEASE_TAG`:$env:EXPECTED_COMMIT -->"
          $ownedNotes = Join-Path $env:RUNNER_TEMP "owned-release-notes.md"
          $notesText = (Get-Content -LiteralPath $notes -Raw).TrimEnd()
          $zipDigest = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $notesText.Contains($zipDigest)) {
            throw "Release notes do not contain the verified public ZIP SHA-256."
          }
          Set-Content -LiteralPath $ownedNotes -Encoding utf8 -Value "$notesText`n`n$marker`n"

          $releaseListJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect existing releases." }
          $matchingReleases = @(
            $releaseListJson | ConvertFrom-Json |
              Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          )
          if ($matchingReleases.Count -gt 1) {
            throw "More than one release exists for the versioned tag."
          }
          if ($matchingReleases.Count -eq 1) {
            $release = $matchingReleases[0]
            if ($release.draft -ne $true) {
              throw "Versioned release is already published; this workflow will not mutate it."
            }
            if (
              -not ([string]$release.body).Contains($marker)
            ) {
              throw "An existing draft is not owned by this exact release workflow run."
            }
            $unexpected = @($release.assets | Where-Object { $assetNames -notcontains $_.name })
            if ($unexpected.Count -ne 0) {
              throw "The owned draft contains an unexpected asset and will not be modified."
            }
          } else {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --target $env:EXPECTED_COMMIT `
              --draft `
              --prerelease `
              --title "Aruba Session Tracker v${version}" `
              --notes-file $ownedNotes
            if ($LASTEXITCODE -ne 0) { throw "Could not create versioned release draft." }
          }

          # A failed upload leaves only a mutable draft. Re-running the exact
          # tag/commit replaces and completes that workflow-owned draft.
          foreach ($assetPath in $assetPaths) {
            gh release upload $env:RELEASE_TAG $assetPath `
              --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Could not upload a versioned draft asset." }
          }

          $releaseListJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $release = @(
            $releaseListJson | ConvertFrom-Json |
              Where-Object { $_.tag_name -eq $env:RELEASE_TAG }
          )[0]
          $releaseJsonPath = Join-Path $env:RUNNER_TEMP "versioned-release-draft.json"
          $release | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $releaseJsonPath -Encoding utf8
          $assetArguments = @()
          foreach ($assetPath in $assetPaths) {
            $assetArguments += @("--asset", "$([IO.Path]::GetFileName($assetPath))=$assetPath")
          }
          & python tools/check_remote_release.py `
            --release-json $releaseJsonPath `
            --tag $env:RELEASE_TAG `
            --expected-commit $env:EXPECTED_COMMIT `
            --state draft `
            --skip-target-check `
            --required-marker $marker `
            @assetArguments
          if ($LASTEXITCODE -ne 0) { throw "Versioned draft verification failed." }

          $authenticatedRoot = Join-Path $env:RUNNER_TEMP "versioned-authenticated-download"
          New-Item -ItemType Directory -Force -Path $authenticatedRoot | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --dir $authenticatedRoot `
            --clobber `
            --pattern $assetNames[0]
          if ($LASTEXITCODE -ne 0) { throw "Could not download draft assets for verification." }
          foreach ($assetPath in $assetPaths) {
            $downloaded = Join-Path $authenticatedRoot ([IO.Path]::GetFileName($assetPath))
            if (
              -not (Test-Path -LiteralPath $downloaded -PathType Leaf) -or
              (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash -ne
                (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
            ) {
              throw "An authenticated draft download differs from the verified local asset."
            }
          }

          # Re-peel the annotated tag immediately before making the draft public.
          Assert-VersionedTagProvenance
          # This is the final remote read before publication: never publish an
          # older verified build after main has moved.
          Assert-MainAtExpected
          gh release edit $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:EXPECTED_COMMIT `
            --draft=false `
            --prerelease `
            --title "Aruba Session Tracker v${version}" `
            --notes-file $ownedNotes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish versioned prerelease." }

          $publishedJson = gh api "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
          if ($LASTEXITCODE -ne 0) { throw "Could not inspect published versioned release." }
          Set-Content -LiteralPath $releaseJsonPath -Encoding utf8 -Value $publishedJson
          & python tools/check_remote_release.py `
            --release-json $releaseJsonPath `
            --tag $env:RELEASE_TAG `
            --expected-commit $env:EXPECTED_COMMIT `
            --state published `
            --skip-target-check `
            --required-marker $marker `
            @assetArguments
          if ($LASTEXITCODE -ne 0) { throw "Published versioned release verification failed." }

          # Verify public, unauthenticated bytes after publication. The
          # workflow's no-mutation policy remains intact even if this final
          # evidence step fails.
          $published = $publishedJson | ConvertFrom-Json
          $publicRoot = Join-Path $env:RUNNER_TEMP "versioned-public-download"
          New-Item -ItemType Directory -Force -Path $publicRoot | Out-Null
          foreach ($assetPath in $assetPaths) {
            $name = [IO.Path]::GetFileName($assetPath)
            $remote = @($published.assets | Where-Object { $_.name -eq $name })
            if ($remote.Count -ne 1) { throw "A public release asset is missing." }
            $downloaded = Join-Path $publicRoot $name
            Invoke-WebRequest -Uri $remote[0].browser_download_url -OutFile $downloaded
            if (
              (Get-FileHash -LiteralPath $downloaded -Algorithm SHA256).Hash -ne
              (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash
            ) {
              throw "A public release download differs from the verified local asset."
            }
          }
          # The public evidence is valid only while the annotated tag still
          # names the commit that produced the verified bytes.
          Assert-VersionedTagProvenance
