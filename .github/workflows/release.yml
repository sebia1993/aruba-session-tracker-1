name: Versioned prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify annotated tag and build Windows assets
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.release_ref.outputs.commit }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out tagged commit with history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Require annotated tag, event SHA, checkout, and current main equality
        id: release_ref
        shell: pwsh
        run: |
          python tools/check_release_ref.py --tag $env:RELEASE_TAG --event-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Release ref gate failed." }
          $commit = (git rev-parse --verify "HEAD^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Could not record verified commit."
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "commit=$commit" -Encoding utf8

      - name: Require synchronized version
        shell: pwsh
        run: |
          python tools/check_version.py --tag $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Release version gate failed." }

      - name: Install pinned dependencies
        shell: pwsh
        run: |
          python -m pip install --no-input -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed." }
          python -m pip install --no-input --no-deps --no-build-isolation --check-build-dependencies -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable package installation failed." }

      - name: Validate and build exact release inputs
        shell: pwsh
        run: |
          ./tools/validate.ps1 -PythonPath python
          $version = $env:RELEASE_TAG.Substring(1)
          ./build_windows.ps1 -PythonPath python -Version $version -SkipValidation -UseCurrentEnvironment

      - name: Retain verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArubaSessionTracker-${{ github.ref_name }}-windows-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish immutable versioned prerelease
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out the verified build scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Set up verification Python 3.13 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Download verified inputs only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ArubaSessionTracker-${{ github.ref_name }}-windows-x64
          path: artifacts/release

      - name: Reverify remote provenance and publish once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not [string]::Equals(
            $env:EXPECTED_COMMIT, $env:GITHUB_SHA, [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Verified build commit does not match the release event."
          }

          $tagRefJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve release tag." }
          $tagRef = $tagRefJson | ConvertFrom-Json
          if ($tagRef.object.type -ne "tag") { throw "Release tag is not annotated." }
          $tagObjectJson = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($tagRef.object.sha)"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve annotated tag object." }
          $tagObject = $tagObjectJson | ConvertFrom-Json
          if (
            $tagObject.object.type -ne "commit" -or
            -not [string]::Equals(
              $tagObject.object.sha, $env:EXPECTED_COMMIT, [StringComparison]::OrdinalIgnoreCase
            )
          ) {
            throw "Annotated tag moved or does not directly reference the verified commit."
          }
          $mainJson = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/heads/main"
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve current main." }
          $main = $mainJson | ConvertFrom-Json
          if (-not [string]::Equals(
            $main.object.sha, $env:EXPECTED_COMMIT, [StringComparison]::OrdinalIgnoreCase
          )) {
            throw "Remote main moved after the verified build."
          }
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Versioned releases are immutable and already exist." }

          $version = $env:RELEASE_TAG.Substring(1)
          $releaseRoot = Join-Path $PWD "artifacts/release"
          ./tools/verify_publish_assets.ps1 `
            -ReleaseRoot $releaseRoot `
            -Version $version `
            -ExpectedCommit $env:EXPECTED_COMMIT
          $zip = Join-Path $releaseRoot "ArubaSessionTracker_v${version}_windows_x64.zip"
          $sha = "$zip.sha256"
          $sbom = Join-Path $releaseRoot "ArubaSessionTracker_v${version}_sbom.cdx.json"
          $notes = Join-Path $releaseRoot "release-notes-v${version}.md"

          gh release create $env:RELEASE_TAG $zip $sha $sbom `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --prerelease `
            --title "Aruba Session Tracker v${version}" `
            --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw "Could not publish versioned prerelease." }
