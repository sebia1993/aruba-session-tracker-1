name: Fix report basis duplication

on:
  push:
    branches:
      - design/dark-noc-console-v1
    paths:
      - .github/workflows/fix-report-basis-duplication.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Check out design branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/dark-noc-console-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Remove duplicated direction fact
        shell: pwsh
        run: |
          $path = "src/aruba_session_tracker/storage/html_report_presentation.py"
          $text = (Get-Content -Raw -Encoding UTF8 $path).Replace("`r`n", "`n")
          $old = '            {_run_fact("검색 방향", query_direction)}'
          $new = '            {_run_fact("보고서 기준", "저장된 관측")}'
          if (-not $text.Contains($old)) {
            throw "Report-basis target line was not found."
          }
          $text = $text.Replace($old, $new)
          [System.IO.File]::WriteAllText(
            (Resolve-Path $path),
            $text,
            [System.Text.UTF8Encoding]::new($false)
          )
          Remove-Item -Force .github/workflows/fix-report-basis-duplication.yml

      - name: Commit report basis fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Patch contains whitespace errors." }
          git commit -m "Remove duplicate report direction fact"
          if ($LASTEXITCODE -ne 0) { throw "Report patch commit failed." }
          git push origin HEAD:design/dark-noc-console-v1
          if ($LASTEXITCODE -ne 0) { throw "Report patch push failed." }
