name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-validate-package:
    name: GitHub-hosted Windows x64 validation and package
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned runtime and development dependencies
        shell: pwsh
        run: |
          python -m pip install --no-input -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed." }
          python -m pip install --no-input --no-deps --no-build-isolation --check-build-dependencies -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable package installation failed." }

      - name: Run safety, lint, typing, tests, coverage, and audit
        shell: pwsh
        run: ./tools/validate.ps1 -PythonPath python

      - name: Build and verify portable package
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { throw "Could not read project version." }
          ./build_windows.ps1 -PythonPath python -Version $version.Trim() -SkipValidation -UseCurrentEnvironment

      - name: Upload verified CI package inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArubaSessionTracker-windows-x64-ci
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 7
