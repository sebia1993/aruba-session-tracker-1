name: Apply Dark NOC payload

on:
  push:
    branches:
      - design/dark-noc-console-v1
    paths:
      - .github/workflows/apply-dark-noc-payload.yml
      - tools/apply_dark_noc_payload.py
      - tools/.dark_noc_payload/**

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - name: Check out design branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: design/dark-noc-console-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock
          check-latest: false

      - name: Install pinned development dependencies
        shell: pwsh
        run: |
          python -m pip install --no-input -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed." }

      - name: Apply and format approved payload
        shell: pwsh
        run: |
          python tools/apply_dark_noc_payload.py
          if ($LASTEXITCODE -ne 0) { throw "Payload application failed." }
          python -m ruff format src/aruba_session_tracker/ui/noc_console.py src/aruba_session_tracker/ui/theme.py tests/test_theme.py src/aruba_session_tracker/storage/html_report_presentation.py src/aruba_session_tracker/storage/__init__.py
          if ($LASTEXITCODE -ne 0) { throw "Ruff formatting failed." }
          Remove-Item -Recurse -Force tools/.dark_noc_payload
          Remove-Item -Force tools/apply_dark_noc_payload.py
          Remove-Item -Force .github/workflows/apply-dark-noc-payload.yml

      - name: Commit approved implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Generated implementation contains whitespace errors." }
          git commit -m "Add standalone investigation report presentation"
          if ($LASTEXITCODE -ne 0) { throw "Generated implementation commit failed." }
          git push origin HEAD:design/dark-noc-console-v1
          if ($LASTEXITCODE -ne 0) { throw "Generated implementation push failed." }
