name: Nightly synthetic soak

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-synthetic-soak
  cancel-in-progress: true

jobs:
  windows-soak:
    name: Windows x64 fixture-only long-running soak
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      ARUBA_SOAK_POLLS: "20000"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned test dependencies
        shell: pwsh
        run: |
          python -m pip install --no-input -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed." }
          python -m pip install --no-input --no-deps --no-build-isolation `
            --check-build-dependencies -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable package installation failed." }

      - name: Run synthetic soak tests only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python -m pytest -m soak -q --junitxml=artifacts/nightly-soak.xml
          if ($LASTEXITCODE -ne 0) { throw "Synthetic soak tests failed." }

      - name: Retain non-sensitive soak result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ArubaSessionTracker-nightly-soak-${{ github.run_id }}
          path: artifacts/nightly-soak.xml
          if-no-files-found: warn
          retention-days: 14
