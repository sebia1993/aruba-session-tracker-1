name: Nightly synthetic soak

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-synthetic-soak
  cancel-in-progress: true

jobs:
  windows-soak:
    name: Windows x64 fixture-only long-running soak
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      ARUBA_SOAK_POLLS: "20000"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install pinned test dependencies
        shell: pwsh
        run: |
          python -m pip install --no-input -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { throw "Pinned dependency installation failed." }
          python -m pip install --no-input --no-deps --no-build-isolation `
            --check-build-dependencies -e .
          if ($LASTEXITCODE -ne 0) { throw "Editable package installation failed." }

      - name: Run synthetic soak tests only
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          python -m pytest -m soak -q --junitxml=artifacts/nightly-soak.xml
          if ($LASTEXITCODE -ne 0) { throw "Synthetic soak tests failed." }

      - name: Retain non-sensitive soak result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArubaSessionTracker-nightly-soak-${{ github.run_id }}
          path: artifacts/nightly-soak.xml
          if-no-files-found: warn
          retention-days: 14
